<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔域</title></head>
<body class="game-page"><main><div class="workbench"><section class="viewport"><div id="stage"></div><div id="hud" hidden aria-label="游戏主界面"></div><p id="status" role="status">正在载入地图与角色…</p></section><aside><section id="entry"><div id="welcome"><h2>开始旅程</h2><p>魔域 · 卡萨诺城</p><button id="new-game">新建游戏</button><button id="continue-game" disabled>继续游戏</button><button id="manage-saves">存档管理</button><p id="save-summary" role="status"></p></div><div id="selection" hidden><h2>选择角色</h2><button id="warrior">男战士</button><button id="mage">女法师</button><p>选择职业后设置角色名。</p><button id="selection-back" type="button">返回开始菜单</button></div><form id="identity" hidden><h2 id="identity-title">男战士信息</h2><label for="player-name">角色名</label><input id="player-name" name="name" value="玩家" maxlength="10" required autocomplete="off"><button type="submit">进入卡萨诺城郊区</button><button id="identity-back" type="button">返回选择</button><button id="identity-cancel" type="button">取消新建</button></form></section><section id="guide" hidden><h2 id="map-name">卡萨诺城郊区</h2><p>按住地面或使用方向键 / WASD 移动，松开停步。</p><p>城郊右侧与城内左侧传送点可往返；走近后按 Q / Ctrl，或按住地面走向出口后松开。</p><p>点击城郊左上方的老兵，选择一种首次礼包。</p><p id="notice" role="status"></p><div id="completed" hidden><h2>已到达卡萨诺城一</h2><p>可继续探索城内商店，或从左侧传送点返回城郊领取礼包、兑换物品和购买产权。</p></div></section><section id="reward-controls" hidden><button id="inventory-button">查看背包与幻兽记录</button><p id="reward-completed" role="status" hidden></p><p id="reward-message" role="status"></p></section><section id="talk" aria-label="老兵对话" hidden><div id="talk-art"></div><div id="talk-role"></div><div class="talk-heading"><span id="talk-head"></span><h2>老兵</h2><button id="close-talk" aria-label="关闭老兵对话">关闭</button></div><p id="talk-words"></p><div id="talk-answers" class="buttons"></div></section></aside></div><section id="inventory" aria-label="背包与幻兽记录" hidden><button id="close-inventory" aria-label="关闭背包">关闭</button><h2 id="bag-count"></h2><span id="ms-value"></span><span id="res-value"></span><div id="bag-items" class="item-grid"></div><section id="ground-section" hidden><h2>地面掉落</h2><div id="ground-items" class="item-grid"></div></section></section><button id="equipment-button" hidden>人物装备</button><section id="equipment-panel" aria-label="人物装备" hidden><button id="close-equipment" aria-label="关闭人物装备">关闭</button><h2>人物装备</h2><div id="equipment-slots"></div><div id="equipment-stats"></div></section><button id="pets-button" hidden>幻兽记录</button><section id="pet-panel" hidden aria-label="幻兽记录"><button id="close-pets" aria-label="关闭幻兽记录">关闭</button><h2 id="pet-count"></h2><div id="pet-items"></div><div id="pet-toolbar"></div><div id="pet-confirm" hidden></div><p id="pet-feedback" role="status"></p><div id="pet-detail" aria-live="polite"></div></section><button id="system-button" hidden>系统菜单</button><section id="system-panel" aria-label="系统菜单" hidden><button id="close-system">关闭系统菜单</button><h2>旅程存档</h2><p>保存到当前浏览器，之后可从开始菜单继续。</p><button id="save-game">保存进度</button><button id="manage-saves-game">备份与导入导出</button><button id="return-menu">返回开始菜单</button></section><p id="save-message" role="status"></p><dialog id="save-confirm"><p id="confirm-message"></p><button id="confirm-yes">确定</button><button id="confirm-no" autofocus>取消</button></dialog></main><script type="module" src="/src/journey-main.ts"></script></body></html>
