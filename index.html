<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔域 · 首个旅程</title></head>
<body><main><header><span class="eyebrow">魔域 2.4 · 现代化</span><h1>从城郊出发</h1><p>新建男战士，走入卡萨诺城。</p></header><div class="workbench"><section class="viewport"><div id="stage"></div><p id="status" role="status">正在载入地图与角色…</p></section><aside><div class="badge">首个可玩切片</div><section id="entry"><div id="welcome"><h2>开始旅程</h2><button id="new-game">新建游戏</button></div><div id="selection" hidden><h2>选择角色</h2><button id="warrior">男战士</button></div><form id="identity" hidden><h2>战士信息</h2><label for="player-name">角色名</label><input id="player-name" name="name" value="玩家" maxlength="10" required autocomplete="off"><button type="submit">进入卡萨诺城郊区</button></form></section><section id="guide" hidden><h2 id="map-name">卡萨诺城郊区</h2><p>按住地面或使用方向键 / WASD 移动，松开停步。</p><p>前往右侧传送点，按 Q 或 Ctrl 进入卡萨诺城一；也可走近后点击传送点。</p><p id="notice" role="status"></p><div id="completed" hidden><h2>已到达卡萨诺城一</h2><p>这次旅程完成。刷新页面可重新新建角色，再走一次。</p></div></section><p class="note">本次包含地面移动和一次切图。NPC可见；对话、战斗、背包、幻兽和存档尚未开放。</p><a href="/actor.html">男战士动作验收 →</a></aside></div><footer>原资源 · 原舞台 580 × 500 · 首个旅程</footer></main><script type="module" src="/src/journey-main.ts"></script></body></html>
