<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔域 · 男战士动作验收</title></head>
<body><main><header><span class="eyebrow">魔域 2.4 · 现代化试点</span><h1>男战士动作验收</h1><p>原资源 · 地面待机、跑动与斩魂</p></header>
<div class="workbench"><section class="viewport"><div id="stage"></div><p id="status" role="status">正在载入原动作资源…</p></section>
<aside><div class="badge">验收工具</div><h2>动作控制</h2><div class="buttons"><button data-action="idle">待机</button><button data-action="run">跑动</button><button data-action="attack">斩魂</button></div><h2>朝向</h2><div class="buttons"><button data-facing="left">← 左</button><button data-facing="right">右 →</button></div><h2>播放</h2><div class="buttons"><button id="pause">暂停</button><button id="step">单步</button><button id="reset">重置</button></div><h2>事件记录</h2><pre id="events">尚无动作事件</pre><p class="note">斩魂期间锁定动作和朝向。末帧写入结束标记，下一逻辑帧发出效果请求。</p><p class="note">本页为动作验收场景，不是原版游戏界面；不包含地图、碰撞或伤害结算。</p></aside></div><footer>原舞台 580 × 500 · 源时间轴 15 Hz · 显示与逻辑时钟独立</footer></main><script type="module" src="/src/main.ts"></script></body></html>
